<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<title>Dosti Chat</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#f6f5f1;--surface:#fff;--text:#1d1d1b;--muted:#77756e;--accent:#2f6fed;--accent-text:#fff;--mine:#2f6fed;--mine-text:#fff;--other:#e9e7e0;--line:#dcd9d0;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#161615;--surface:#1f1f1d;--text:#efede6;--muted:#9a978e;--accent:#6d9bff;--accent-text:#101010;--mine:#3b64c9;--other:#2a2a27;--line:#34342f;color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:16px/1.4 -apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column}
header{padding:12px 16px;background:var(--surface);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:8px}
header h1{font-size:17px;margin:0}
header small{color:var(--muted)}
#home{margin:auto;width:min(360px,92%);display:flex;flex-direction:column;gap:10px;text-align:center}
#home h2{margin:0 0 4px}
#home p{color:var(--muted);margin:0 0 6px;font-size:14px}
hr{border:0;border-top:1px solid var(--line);width:100%;margin:6px 0}
#list{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:6px}
.m{max-width:80%;padding:8px 12px;border-radius:16px;background:var(--other);align-self:flex-start;overflow-wrap:anywhere}
.m.me{background:var(--mine);color:var(--mine-text);align-self:flex-end}
.m b{display:block;font-size:12px;opacity:.75;margin-bottom:2px}
.m i{display:block;font-size:11px;opacity:.6;font-style:normal;text-align:right;margin-top:2px}
.sys{align-self:center;color:var(--muted);font-size:13px;text-align:center}
.bar{display:flex;gap:8px;padding:10px;background:var(--surface);border-top:1px solid var(--line)}
#home .bar{padding:0;background:none;border:0}
input{flex:1;min-width:0;padding:11px 14px;border-radius:22px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:16px}
button{border:0;border-radius:22px;padding:11px 18px;background:var(--accent);color:var(--accent-text);font-size:16px;font-weight:600}
button.alt{background:var(--other);color:var(--text)}
#err{color:#d33;min-height:1.2em;font-size:14px}
</style>
</head>
<body>
<header><h1>💬 Dosti Chat</h1><small id="info"></small></header>

<div id="home">
  <h2>Doston ke saath chat</h2>
  <p>Koi account nahi chahiye. Room banao ya code se join karo.</p>
  <input id="nick" maxlength="20" placeholder="Tumhara naam">
  <button id="create">Naya room banao</button>
  <hr>
  <div class="bar"><input id="code" maxlength="8" placeholder="Room code" autocapitalize="characters"><button class="alt" id="join">Join</button></div>
  <div id="err"></div>
</div>

<div id="list" hidden></div>
<div class="bar" id="composer" hidden>
  <input id="txt" maxlength="500" placeholder="Message likho…" autocomplete="off">
  <button id="send">Send</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const PREFIX="dosti-chat-";
let peer=null,isHost=false,code="",nick="",hostConn=null,conns=[],history=[];

try{$("nick").value=localStorage.getItem("nick")||""}catch(e){}
if(location.hash.length>1)$("code").value=decodeURIComponent(location.hash.slice(1)).toUpperCase();

function err(m){$("err").textContent=m}
function genCode(){const c="ABCDEFGHJKMNPQRSTUVWXYZ23456789";let s="";for(let i=0;i<5;i++)s+=c[Math.floor(Math.random()*c.length)];return s}
function getNick(){
  nick=$("nick").value.trim();
  if(!nick){err("Pehle apna naam likho.");return false}
  try{localStorage.setItem("nick",nick)}catch(e){}
  return true;
}
function enterRoom(){
  $("home").hidden=true;$("list").hidden=false;$("composer").hidden=false;
  $("info").textContent="Room: "+code+" · "+nick;
  location.hash=code;
}
function add(m){
  const l=$("list"),el=document.createElement("div");
  if(m.t==="sys"){el.className="sys";el.textContent=m.x}
  else{
    el.className="m"+(m.n===nick?" me":"");
    const b=document.createElement("b");b.textContent=m.n;
    const s=document.createElement("span");s.textContent=m.x;
    const i=document.createElement("i");
    i.textContent=new Date(m.ts).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"});
    el.append(b,s,i);
  }
  l.appendChild(el);l.scrollTop=l.scrollHeight;
}
function broadcast(m,except){conns.forEach(c=>{if(c.open&&c!==except)c.send(m)})}
function hostPost(m){
  if(m.t==="msg"){history.push(m);if(history.length>50)history.shift()}
  add(m);broadcast(m);
}

function startHost(tries){
  code=genCode();
  peer=new Peer(PREFIX+code);
  peer.on("open",()=>{isHost=true;enterRoom();add({t:"sys",x:"Room ban gaya. Code “"+code+"” doston ko bhejo (ya is page ka link). Tum band karoge to room khatam ho jayega."})});
  peer.on("error",e=>{
    if(e.type==="unavailable-id"&&tries<5){peer.destroy();startHost(tries+1)}
    else err("Room nahi ban paya ("+e.type+"). Internet check karo.");
  });
  peer.on("connection",c=>{
    let name="Koi";
    c.on("data",d=>{
      if(d.t==="hello"){
        name=String(d.n||"Koi").slice(0,20);
        conns.push(c);
        c.send({t:"history",h:history});
        const s={t:"sys",x:name+" aa gaya 👋"};
        add(s);broadcast(s,c);
      }else if(d.t==="msg"){
        hostPost({t:"msg",n:name,x:String(d.x).slice(0,500),ts:Date.now()});
      }
    });
    c.on("close",()=>{
      conns=conns.filter(x=>x!==c);
      const s={t:"sys",x:name+" chala gaya"};add(s);broadcast(s);
    });
  });
}

function startJoin(c){
  code=c.trim().toUpperCase();
  if(!code){err("Room code likho.");return}
  err("Connect ho raha hai…");
  peer=new Peer();
  const fail=setTimeout(()=>err("Connect nahi hua. Code ya internet check karo."),15000);
  peer.on("open",()=>{
    hostConn=peer.connect(PREFIX+code,{reliable:true});
    hostConn.on("open",()=>{
      clearTimeout(fail);err("");enterRoom();
      hostConn.send({t:"hello",n:nick});
    });
    hostConn.on("data",d=>{
      if(d.t==="history")d.h.forEach(add);
      else add(d);
    });
    hostConn.on("close",()=>{add({t:"sys",x:"Room band ho gaya (host chala gaya)."});$("composer").hidden=true});
  });
  peer.on("error",e=>{
    clearTimeout(fail);
    err(e.type==="peer-unavailable"?"Ye room nahi mila. Code sahi hai? Host ka page khula hona chahiye.":"Error: "+e.type);
  });
}

function send(){
  const v=$("txt").value.trim();
  if(!v)return;
  $("txt").value="";
  if(isHost)hostPost({t:"msg",n:nick,x:v,ts:Date.now()});
  else if(hostConn&&hostConn.open)hostConn.send({t:"msg",x:v});
}

$("create").onclick=()=>{if(getNick()){err("");startHost(0)}};
$("join").onclick=()=>{if(getNick())startJoin($("code").value)};
$("send").onclick=send;
$("txt").addEventListener("keydown",e=>{if(e.key==="Enter")send()});
</script>
</body>
</html>
